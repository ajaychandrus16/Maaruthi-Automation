<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Login | MAARUTHI AUTOMATION
    </title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <style>

        body {

            margin: 0;

            font-family:
                Arial,
                sans-serif;

            background:
                #f5f2ed;
        }


        .login-page {

            min-height:
                100vh;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            background:
                #f5f2ed;

            padding:
                20px;

            box-sizing:
                border-box;
        }


        .login-card {

            width:
                400px;

            max-width:
                100%;

            background:
                #ffffff;

            border-radius:
                14px;

            padding:
                40px;

            box-sizing:
                border-box;

            box-shadow:
                0 8px 30px
                rgba(80, 50, 20, 0.12);
        }


        .login-brand {

            text-align:
                center;

            margin-bottom:
                30px;
        }


        .login-brand-icon {

            width:
                58px;

            height:
                58px;

            margin:
                0 auto 12px;

            border-radius:
                12px;

            background:
                #d8891c;

            color:
                #ffffff;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            font-size:
                28px;

            font-weight:
                bold;
        }


        .login-brand h1 {

            margin:
                0;

            color:
                #4b2e18;

            font-size:
                24px;

            letter-spacing:
                1px;
        }


        .login-brand p {

            margin:
                5px 0 0;

            color:
                #8a6a4d;

            font-size:
                12px;

            letter-spacing:
                2px;
        }


        .login-title {

            text-align:
                center;

            margin-bottom:
                25px;
        }


        .login-title h2 {

            margin:
                0 0 7px;

            color:
                #3f2a1b;

            font-size:
                22px;
        }


        .login-title span {

            color:
                #8a7a6b;

            font-size:
                14px;
        }


        .form-group {

            margin-bottom:
                18px;
        }


        .form-group label {

            display:
                block;

            margin-bottom:
                7px;

            color:
                #4b3828;

            font-size:
                14px;

            font-weight:
                600;
        }


        .form-group input {

            width:
                100%;

            padding:
                12px 13px;

            border:
                1px solid #d8cfc4;

            border-radius:
                8px;

            box-sizing:
                border-box;

            font-size:
                14px;

            outline:
                none;

            background:
                #fff;
        }


        .form-group input:focus {

            border-color:
                #d8891c;

            box-shadow:
                0 0 0 3px
                rgba(216, 137, 28, 0.12);
        }


        .login-button {

            width:
                100%;

            border:
                none;

            border-radius:
                8px;

            padding:
                13px;

            background:
                #d8891c;

            color:
                #ffffff;

            font-size:
                15px;

            font-weight:
                bold;

            cursor:
                pointer;
        }


        .login-button:hover {

            background:
                #bd7411;
        }


        .login-message {

            display:
                none;

            margin-bottom:
                15px;

            padding:
                10px;

            border-radius:
                7px;

            background:
                #fff4df;

            color:
                #8a570d;

            font-size:
                13px;

            text-align:
                center;
        }


        .login-info {

            margin-top:
                22px;

            padding:
                13px;

            border-radius:
                8px;

            background:
                #faf7f2;

            border:
                1px solid #e8ded2;

            text-align:
                center;
        }


        .login-info strong {

            display:
                block;

            color:
                #4b3828;

            font-size:
                13px;

            margin-bottom:
                5px;
        }


        .login-info span {

            color:
                #7e6d5c;

            font-size:
                12px;
        }


        .login-footer {

            text-align:
                center;

            margin-top:
                25px;

            color:
                #9a8978;

            font-size:
                11px;

            line-height:
                1.6;
        }


        @media (max-width: 500px) {

            .login-card {

                padding:
                    30px 22px;
            }

        }

    </style>

</head>


<body>


    <div class="login-page">


        <div class="login-card">


            <!-- =========================
                 BRAND
            ========================= -->

            <div class="login-brand">


                <div class="login-brand-icon">
                    M
                </div>


                <h1>
                    MAARUTHI
                </h1>


                <p>
                    AUTOMATION
                </p>


            </div>



            <!-- =========================
                 LOGIN TITLE
            ========================= -->

            <div class="login-title">

                <h2>
                    Welcome Back
                </h2>

                <span>
                    Sign in to Loom Management System
                </span>

            </div>



            <!-- =========================
                 MESSAGE
            ========================= -->

            <div
                class="login-message"
                id="loginMessage"
            ></div>



            <!-- =========================
                 LOGIN FORM
            ========================= -->

            <form
                id="loginForm"
            >


                <div class="form-group">

                    <label
                        for="username"
                    >
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        placeholder="Enter username"
                        autocomplete="username"
                        required
                    >

                </div>



                <div class="form-group">

                    <label
                        for="password"
                    >
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter password"
                        autocomplete="current-password"
                        required
                    >

                </div>



                <button
                    type="submit"
                    class="login-button"
                >
                    Sign In
                </button>


            </form>



            <!-- =========================
                 LOGIN INFORMATION
            ========================= -->

            <div class="login-info">

                <strong>
                    Authorized Login
                </strong>

                <span>
                    Use your registered MAARUTHI credentials
                </span>

            </div>



            <!-- =========================
                 FOOTER
            ========================= -->

            <div class="login-footer">

                MAARUTHI AUTOMATION

                <br>

                Textile Loom Monitoring &amp;
                Management System

            </div>


        </div>


    </div>



    <!-- =========================
         AUTHENTICATION
    ========================= -->

    <script src="js/auth.js"></script>


    <script>


        /* =========================================
           ALREADY LOGGED IN
        ========================================= */

        if (isLoggedIn()) {

            window.location.href =
                "index.html";

        }



        /* =========================================
           LOGIN FORM
        ========================================= */

        document
            .getElementById("loginForm")
            .addEventListener(
                "submit",
                function(event) {

                    event.preventDefault();


                    const username =
                        document
                            .getElementById("username")
                            .value
                            .trim();


                    const password =
                        document
                            .getElementById("password")
                            .value;


                    const message =
                        document
                            .getElementById("loginMessage");


                    if (
                        loginUser(
                            username,
                            password
                        )
                    ) {

                        message.style.display =
                            "none";


                        window.location.href =
                            "index.html";

                    }

                    else {

                        message.textContent =
                            "Invalid username or password. Please try again.";

                        message.style.display =
                            "block";

                    }

                }
            );


    </script>


</body>

</html>
